<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Crypto Edu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0b0e11;--surface:#14171c;--surface2:#1a1d24;--border:#2a2e37;--text:#f0f2f5;--muted:#8b93a7;--green:#0ecb81;--red:#f6465d;--accent:#f0b90b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.logo{font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px}.logo span{color:var(--accent)}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:600;font-size:.9rem;cursor:pointer}
.btn-primary{background:var(--green);color:#000}.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.container{max-width:480px;margin:0 auto;padding:0 12px 80px}
.auth-box{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px}
.auth-box h1{font-size:1.5rem;margin-bottom:6px;text-align:center}
.auth-box p{color:var(--muted);text-align:center;margin-bottom:18px;font-size:.9rem}
.auth-box input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-size:1rem;margin-bottom:12px}
.auth-box .btn{width:100%;margin-top:4px}
.mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.mode-btns button{padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:600;cursor:pointer}
.mode-btns button.active{background:var(--green);color:#000;border-color:var(--green)}
.balance-card{background:linear-gradient(145deg,#1a1d24,#14171c);border:1px solid var(--border);border-radius:16px;padding:22px 18px;margin:16px 0;text-align:center}
.balance-label{color:var(--muted);font-size:.85rem}.balance-value{font-size:2rem;font-weight:700;margin:4px 0}
.balance-pnl{font-size:.95rem;font-weight:500}.positive{color:var(--green)}.negative{color:var(--red)}
.balance-sub{display:flex;justify-content:center;gap:28px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.balance-sub .label{font-size:.75rem;color:var(--muted)}.balance-sub .val{font-weight:600;font-size:.95rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.actions .btn{padding:13px}
.section-title{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px;font-weight:600}
.asset-row{display:flex;align-items:center;padding:13px 12px;background:var(--surface);border-radius:12px;margin-bottom:6px;cursor:pointer}
.asset-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;margin-right:12px}
.asset-info{flex:1}.asset-name{font-weight:600;font-size:.92rem}.asset-symbol{color:var(--muted);font-size:.78rem}
.asset-right{text-align:right}.asset-price{font-weight:600;font-size:.92rem}.asset-change{font-size:.78rem;font-weight:500}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
.chart-container{height:220px;position:relative}
.warning{background:rgba(246,70,93,.1);border:1px solid rgba(246,70,93,.25);color:#f8a0ab;padding:10px;border-radius:10px;font-size:.78rem;text-align:center;margin:12px 0}
.status{text-align:center;font-size:.75rem;color:var(--muted);margin-top:8px}.hidden{display:none!important}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:22px 18px 30px}
.modal h3{margin-bottom:14px}.modal select,.modal input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:10px;font-size:1rem;margin-bottom:12px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#error-box{color:var(--red);font-size:.85rem;text-align:center;margin-top:10px;min-height:20px}
</style>
</head>
<body>
<!-- See full source on Netlify: https://cryptoedu-fr.netlify.app — full app deployed from local build -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="logo" style="justify-content:center;font-size:1.4rem;margin-bottom:8px"><span>◈</span> Crypto Edu</div>
    <h1 id="auth-title">Connexion</h1>
    <p>Compte + sauvegarde cloud de ton portefeuille</p>
    <div class="mode-btns">
      <button type="button" id="btn-login" class="active" onclick="setMode(false)">Connexion</button>
      <button type="button" id="btn-register" onclick="setMode(true)">Créer un compte</button>
    </div>
    <div id="username-wrap" style="display:none">
      <input type="text" id="auth-username" placeholder="Pseudo" autocomplete="username">
    </div>
    <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
    <input type="password" id="auth-password" placeholder="Mot de passe (min. 6)" autocomplete="current-password">
    <button class="btn btn-primary" id="auth-submit" onclick="doAuth()">Se connecter</button>
    <p id="error-box"></p>
    <p style="text-align:center;margin-top:16px;font-size:.8rem;color:var(--muted)">Site live: <a href="https://cryptoedu-fr.netlify.app" style="color:var(--accent)">cryptoedu-fr.netlify.app</a></p>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://hzvuivqdutgfeglivfro.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6dnVpdnFkdXRnZmVnbGl2ZnJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDQ1NDcsImV4cCI6MjEwMzQyMDU0N30._WZRPoXgutU2NPF9WrNR_g2BFur5a5PThfrhsgKYMsQ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
function setMode(reg){
  document.getElementById('auth-title').textContent=reg?'Créer un compte':'Connexion';
  document.getElementById('auth-submit').textContent=reg?"S'inscrire":'Se connecter';
  document.getElementById('username-wrap').style.display=reg?'block':'none';
  document.getElementById('btn-login').classList.toggle('active',!reg);
  document.getElementById('btn-register').classList.toggle('active',reg);
  window._isRegister=reg;
}
async function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  const username=document.getElementById('auth-username').value.trim();
  const err=document.getElementById('error-box');
  err.textContent='';
  try{
    if(window._isRegister){
      if(!username||username.length<3){err.textContent='Pseudo min. 3 caractères';return;}
      const {error}=await sb.auth.signUp({email,password,options:{data:{username,display_name:username}}});
      if(error) throw error;
      err.style.color='var(--green)'; err.textContent='Compte créé. Connecte-toi.'; setMode(false);
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
      window.location.href='https://cryptoedu-fr.netlify.app';
    }
  }catch(e){ err.style.color='var(--red)'; err.textContent=e.message||'Erreur'; }
}
sb.auth.getSession().then(({data})=>{ if(data.session) window.location.href='https://cryptoedu-fr.netlify.app'; });
</script>
</body>
</html>
